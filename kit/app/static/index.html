<script>
/* Paint the saved palette before the first render, so the workspace never
   flashes the default theme on the way to the chosen one. */
(function(){var r=document.documentElement;try{
  var s=JSON.parse(localStorage.getItem('companion-appearance')||'{}');
  var t=s.follow_system?(matchMedia('(prefers-color-scheme: dark)').matches?s.dark_theme:s.light_theme):s.theme;
  r.dataset.theme=t||'midnight';
  if(s.accent)r.style.setProperty('--accent',s.accent);
}catch(e){r.dataset.theme='midnight';}})();
</script>

<script>
const TABS=[['now','Home'],['chat','Conversation'],['timeline','Timeline'],['photos','Photos & albums'],['journals','Journal'],['creations','Creations'],['relationship','Together'],['loops','Plans & calendar'],['knows','Memories'],['vault','Vault'],['identity','Identity'],['settings','Preferences'],['environment','Hermes settings'],['health','Jobs & health'],['roster','Companions'],['more','More']];
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);
const token=params.get('token')||sessionStorage.getItem('companion-token')||'';
if(token)sessionStorage.setItem('companion-token',token);
if(params.has('token')){params.delete('token');history.replaceState(null,'',location.pathname+'?'+params+location.hash);}
const INSTALLATION=params.get('installation')||'existing';
let PROFILE=params.get('profile');
function scoped(path){const u=new URL(path,location.origin);u.searchParams.set('installation',INSTALLATION);if(PROFILE)u.searchParams.set('profile',PROFILE);return u.pathname+u.search;}
function rawMediaUrl(path){const u=new URL(scoped(path),location.origin);if(token)u.searchParams.set('token',token);return u.pathname+u.search;}
function mediaUrl(path){return esc(rawMediaUrl(path));}
const workspaceHandlers={};
async function api(path,options){
  const opts=Object.assign({headers:{'content-type':'application/json'}},options||{});
  if(token)opts.headers['x-companion-token']=token;
  const r=await fetch(scoped('/api'+path),opts);
  if(!r.ok){
    const d=await r.json().catch(()=>({}));
    if(r.status===401&&d.pin_required){
      initPinModal();
      showPinModal();
    }
    const error=new Error(d.detail||d.error||('Request failed: '+r.status));
    error.status=r.status;
    error.pin_required=Boolean(d.pin_required);
    throw error;
  }
  return r.json();
}

function showPinModal(){
  const modal=$('pin-modal');
  if(!modal)return;
  const input=$('pin-modal-input');
  const error=$('pin-modal-error');
  if(error){error.textContent='';error.style.display='none';}
  if(input)input.value='';
  if(!modal.open){
    try{modal.showModal();}catch(e){modal.setAttribute('open','true');}
  }
  if(input)setTimeout(()=>input.focus(),50);
}

function initPinModal(){
  const form=$('pin-modal-form');
  const input=$('pin-modal-input');
  const error=$('pin-modal-error');
  const submitBtn=$('pin-modal-submit');
  if(!form||form._wired)return;
  form._wired=true;
  if(input){
    input.oninput=()=>{
      if(input.value.length===4){
        form.requestSubmit();
      }
    };
  }
  form.onsubmit=async(e)=>{
    e.preventDefault();
    const pin=(input.value||'').trim();
    if(pin.length!==4||!/^\d{4}$/.test(pin)){
      error.textContent='Please enter a 4-digit numeric PIN';
      error.style.display='block';
      return;
    }
    submitBtn.disabled=true;
    try{
      const r=await fetch(scoped('/api/auth/pin'),{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({pin})
      });
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.ok){
        error.style.display='none';
        try{$('pin-modal').close();}catch(err){$('pin-modal').removeAttribute('open');}
        if(typeof boot==='function')await boot();
        else await render(current);
      }else{
        error.textContent=d.detail||'Incorrect 4-digit PIN. Please try again.';
        error.style.display='block';
        input.value='';
        input.focus();
      }
    }catch(err){
      error.textContent='Could not contact companion server';
      error.style.display='block';
    }finally{
      submitBtn.disabled=false;
    }
  };
}
document.addEventListener('DOMContentLoaded',()=>initPinModal());
let current='now';
async function showTab(name){
  if(typeof confirmEditorLeave==='function'&&!await confirmEditorLeave(current))return;
  if(name!=='chat'&&window.stopBrowserVoice)stopBrowserVoice();
  current=name;history.replaceState(null,'',location.pathname+location.search+'#'+name);
  for(const [id] of TABS){const el=$(id);if(el)el.hidden=id!==name;}
  for(const b of $('tabs').querySelectorAll('button[data-tab]'))b.setAttribute('aria-current',String(b.dataset.tab===name));
  if(window.productNavigate)window.productNavigate(name);
  const cur=$(name);
  if(cur&&!cur.textContent.trim())cur.innerHTML='<div class="card dim" role="status">Loading your companion’s world…</div>';
  render(name);
}
$('tabs').innerHTML=TABS.map(([id,label])=>`<button data-tab="${id}">${label}</button>`).join('');
for(const b of $('tabs').querySelectorAll('button[data-tab]'))b.onclick=()=>showTab(b.dataset.tab);

function ago(iso){
  if(!iso)return 'never';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90)return 'just now';
  if(s<5400)return Math.round(s/60)+' minutes ago';
  if(s<172800)return Math.round(s/3600)+' hours ago';
  return Math.round(s/86400)+' days ago';
}

async function render(name){
  try{
    if(name==='chat'&&typeof stopBrowserVoice==='function')stopBrowserVoice();
    if(workspaceHandlers[name])return await workspaceHandlers[name]();
    if(name==='now')return await renderNow();
    if(name==='timeline')return await renderTimeline();
    if(name==='loops')return await renderLoops();
    if(name==='knows')return await renderKnows();
    if(name==='settings')return await renderSettings();
    if(name==='identity')return await renderIdentity();
    if(name==='health')return await renderHealth();
  }catch(e){$(name).innerHTML=`<div class="card bad">Could not load this: ${esc(e.message)}</div>`;}
}

async function renderNow(){
  const d=await api('/overview');
  $('who').textContent=d.agent;
  $('sub').textContent=`${d.type} · ${d.age} · ${d.human} · ${d.timezone}`;
  $('banner').innerHTML=d.problems.length
    ? `<span class="bad">${d.problems.length} thing(s) not working</span>`
    : (d.birthday_in===0?'<span class="warn">It is her birthday today</span>':'');
  const s=d.state&&d.state.state;
  const unconfirmed=s&&s.confirmed===false;
  const moods=d.moods.slice().reverse();
  $('now').innerHTML=`
  <div class="card">
    <h2>Right now</h2>
    ${s?`<p class="big">${esc(s.activity)} — ${esc(s.location)}</p>
      <p class="dim">${esc(s.outfit.map(o=>o.description).join(', '))}</p>
      <p>Mood: ${esc(s.mood)}</p>
      ${s.wants&&s.wants.length?`<p class="dim">Wants: ${esc(s.wants.join('; '))}</p>`:''}
      ${s.private_stance?`<p class="dim">Where she stands: ${esc(s.private_stance)}</p>`:''}
      <p class="dim">recorded ${ago(d.state.recorded_at)}
      ${unconfirmed?'<span class="warn"> · unconfirmed, carried forward by a script</span>':''}</p>`
     :'<p class="dim">No state recorded yet.</p>'}
  </div>
  <div class="row">
    <div class="card"><h2>Mood, recently</h2>
      <div class="spark">${moods.map((m,i)=>`<i style="height:${20+((i*37)%70)}%" title="${esc(m.mood)}"></i>`).join('')}</div>
      <ul class="dim" style="margin-top:12px">${moods.slice(-5).reverse().map(m=>`<li>${esc(m.mood)}</li>`).join('')}</ul>
    </div>
    ${d.bars?`<div class="card"><h2>How it is going</h2>
      <p>Feeling the gap <strong>${Math.round((d.bars.feeling_the_gap||0)*100)}%</strong>${d.bars.wellbeing!=null?` · Wellbeing <strong>${Math.round(d.bars.wellbeing*100)}%</strong>`:''}</p>
      <p class="dim">Computed from how long it has been and what she has recorded feeling. She sees these; nothing tells her to mention them.</p></div>`:''}
    <div class="card"><h2>The thread</h2>
      ${d.thread&&d.thread.available
        ?`<p class="big">${esc(d.thread.register)}</p>
          <p class="dim">last from ${esc(d.human)} ${ago(d.thread.last_from_human)}</p>
          <p class="dim">${esc(d.thread.guidance)}</p>`
        :'<p class="dim">No conversation history yet.</p>'}
    </div>
  </div>
  <div class="row">
    <div class="card"><h2>Open loops (${d.loops.length})</h2>
      <ul>${d.loops.map(l=>`<li>${esc(l.title)}<br><span class="dim">${esc(l.gentle_use)}</span></li>`).join('')||'<li class="dim">Nothing hanging.</li>'}</ul></div>
    <div class="card"><h2>Waiting to send (${d.queued.length})</h2>
      <ul>${d.queued.map(q=>`<li><span class="pill">${esc(q.content)}</span> ${esc(q.body.slice(0,90))}</li>`).join('')||'<li class="dim">Nothing queued.</li>'}</ul></div>
  </div>`;
}

async function renderTimeline(){
  const d=await api('/timeline');
  if(!d.enabled){$('timeline').innerHTML='<div class="card dim">The image timeline is switched off for this companion.</div>';return;}
  const c=d.captures;
  $('timeline').innerHTML=`
  <div class="card">
    <h2>Scrub the day</h2>
    <input id="scrub" type="range" min="0" max="${Math.max(0,c.length-1)}" value="0">
    <div id="frame"></div>
  </div>
  <div class="card"><h2>${c.length} captures · ${d.budget_gb} GB budget</h2>
    <div class="grid">${c.map((x,i)=>`<figure class="shot" style="margin:0">
      <img src="${mediaUrl(x.image)}" loading="lazy" data-i="${i}" alt="${esc(x.activity)}">
      <figcaption class="cap">${esc(x.at||'').slice(0,16).replace('T',' ')}<br>${esc(x.activity)} — ${esc(x.location)}
      <br><button class="quiet" data-keep="${x.id}">Keep</button></figcaption></figure>`).join('')||'<p class="dim">No images yet.</p>'}</div>
  </div>
  ${d.albums.length?`<div class="card"><h2>Albums</h2><ul>${d.albums.map(a=>`<li>${esc(a.name)} — ${a.count} image(s)</li>`).join('')}</ul></div>`:''}`;
  const frame=(i)=>{const x=c[i];if(!x){$('frame').innerHTML='';return;}
    $('frame').innerHTML=`<div class="row" style="margin-top:14px">
      <img src="${mediaUrl(x.image)}" style="max-width:320px;border-radius:8px">
      <div><p class="big">${esc(x.activity)} — ${esc(x.location)}</p>
      <p class="dim">${esc(x.outfit)}</p><p>Mood: ${esc(x.mood)}</p>
      <p class="dim">${esc(x.at||'').slice(0,16).replace('T',' ')}</p></div></div>`;};
  frame(0);
  const scrub=$('scrub');
  if(scrub)scrub.oninput=()=>frame(Number(scrub.value));
  for(const img of $('timeline').querySelectorAll('img[data-i]'))
    img.onclick=()=>{if(scrub){scrub.value=img.dataset.i;frame(Number(img.dataset.i));window.scrollTo({top:0,behavior:'smooth'});}};
  for(const b of $('timeline').querySelectorAll('[data-keep]'))
    b.onclick=async()=>{await api(`/timeline/${b.dataset.keep}/keep`,{method:'POST'});b.textContent='Kept';};
}

async function renderLoops(){
  const [d,m]=await Promise.all([api('/overview'),api('/missions')]);
  $('loops').innerHTML=`
  <div class="card"><h2>Add Task or Research Item</h2>
    <label>What do you want looked into?<input id="mtitle" placeholder="e.g. Research lodging options for weekend trip"></label>
    <label>Details & constraints<input id="mdetail" placeholder="Budget, preferences, specific requirements"></label>
    <label>Target completion date<input id="mwhen" placeholder="YYYY-MM-DD"></label>
    <button class="act" id="madd">Add to queue</button>
    <p class="dim" style="margin-top:10px">Processed during scheduled autonomy windows. Outbound updates respect quiet hours and daily message caps.</p>
  </div>
  <div class="card"><h2>Task Queue</h2>
    <table><tr><th>Task</th><th>Status</th><th></th></tr>
    ${m.missions.map(x=>`<tr><td>${esc(x.title)}<br><span class="dim">${esc(x.detail||'')}</span>
      ${x.detail_update?`<br><span class="dim">→ ${esc(x.detail_update)}</span>`:''}</td>
      <td><span class="pill">${esc(x.status)}</span></td>
      <td>${x.status==='open'?`<button class="quiet" data-drop="${x.id}">Drop</button>`:''}</td></tr>`).join('')
      ||'<tr><td class="dim" colspan="3">No active tasks in queue.</td></tr>'}</table></div>
  <div class="card"><h2>Open Threads</h2>
    <ul>${d.loops.map(l=>`<li><strong>${esc(l.title)}</strong>${l.detail?`<br>${esc(l.detail)}`:''}
      <br><span class="dim">Context: ${esc(l.gentle_use)}</span></li>`).join('')||'<li class="dim">No active open threads.</li>'}</ul>
    <p class="dim">Autonomous conversational threads tracked across sessions.</p></div>`;
  $('madd').onclick=async()=>{
    const title=$('mtitle').value.trim();if(!title)return;
    await api('/missions',{method:'POST',body:JSON.stringify(
      {title,detail:$('mdetail').value,wanted_by:$('mwhen').value})});
    renderLoops();};
  for(const b of $('loops').querySelectorAll('[data-drop]'))
    b.onclick=async()=>{await api(`/missions/${b.dataset.drop}/drop`,{method:'POST'});renderLoops();};
}

async function renderKnows(){
  const d=await api('/ledgers');
  $('knows').innerHTML=`
  <div class="card"><h2>Standing Guidelines (${d.standing.length})</h2>
    <ul>${d.standing.map(r=>`<li>${esc(r.instruction)}<br><span class="dim">Evidence: ${esc(r.evidence)}</span></li>`).join('')||'<li class="dim">None recorded.</li>'}</ul></div>
  <div class="card"><h2>Personal Facts (${d.facts.length})</h2>
    <table><tr><th>Fact</th><th>Evidence</th><th></th></tr>
    ${d.facts.map(f=>`<tr><td>${esc(f.statement)}<br><span class="pill">${esc(f.category)}</span></td>
      <td class="dim">${esc(f.evidence)}</td>
      <td><button class="quiet" data-forget="${f.id}">Mark incorrect</button></td></tr>`).join('')
      ||'<tr><td class="dim" colspan="3">No facts recorded yet.</td></tr>'}</table>
    <p class="dim">Marking a fact incorrect records a superseding correction without deleting original evidence.</p></div>
  <div class="card"><h2>Shared History & Milestones (${d.relationship.length})</h2>
    <ul>${d.relationship.map(r=>`<li><span class="pill">${esc(r.moment)}</span> ${esc(r.text)}</li>`).join('')||'<li class="dim">No milestones recorded yet.</li>'}</ul></div>
  <div class="card"><h2>Open Questions</h2>
    <ul>${d.questions.map(q=>`<li>${esc(q.text)}</li>`).join('')||'<li class="dim">No open questions.</li>'}</ul></div>`;
  for(const b of $('knows').querySelectorAll('[data-forget]'))
    b.onclick=async()=>{await api(`/facts/${b.dataset.forget}/forget`,{method:'POST'});renderKnows();};
}

async function renderSettings(){
  const s=await api('/settings');
  const perm=(k)=>['yes','ask','no'].map(v=>`<option value="${v}"${s.content_permissions[k]===v?' selected':''}>${v}</option>`).join('');
  $('settings').innerHTML=`
  <div class="card" data-preference-panel="contact">
    <h2>Quiet Hours & Boundaries</h2>
    <p class="dim">Replies are always allowed at any hour. Quiet hours only govern messages the companion initiates proactively.</p>
    <div class="row" style="margin-top:14px">
      <label>Quiet from<input id="qs" value="${esc(s.quiet_start)}" placeholder="22:00"></label>
      <label>until<input id="qe" value="${esc(s.quiet_end)}" placeholder="08:00"></label>
    </div>
    <label style="margin-top:10px;display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="adapt" ${s.adaptive_quiet?'checked':''} style="width:auto">
      <span>Let quiet hours drift toward the hours you actually keep</span>
    </label>

    <h2 style="margin-top:28px">Outreach & Initiative</h2>
    <p class="dim">Govern how often and in what formats your companion initiates contact outside your active chats.</p>
    <div class="form-grid" style="margin-top:14px">
      <div>
        <label>Maximum proactive messages a day
          <input id="cap" type="number" required min="1" max="100" value="${s.outreach_per_day||3}" ${s.outreach_per_day===0?'disabled':''}>
        </label>
        <label style="margin-top:6px;display:flex;align-items:center;gap:8px">
          <input id="cap-unlimited" type="checkbox" ${s.outreach_per_day===0?'checked':''} style="width:auto">
          <span>No daily limit (unlimited proactive messages)</span>
        </label>
      </div>
      <label>May write first
        <select id="out">${options([['free','Social messages welcome'],['updates_only','Only meaningful updates'],['never','Replies only']],s.outreach)}</select>
      </label>
      <label>Unprompted photos
        <select id="pimage">${perm('image')}</select>
      </label>
      <label>Unprompted voice notes
        <select id="pvoice">${perm('voice')}</select>
      </label>
    </div>
  </div>

  <div class="card" data-preference-panel="routine">
    <h2>Daily Rhythm & Autonomy</h2>
    <p class="dim">Independent activity windows when your companion reflects on their day, reads, or runs autonomous routines.</p>
    <label style="margin-top:12px">Autonomy Windows (HH:MM, comma separated)
      <input id="win" value="${esc(s.autonomy_windows.join(', '))}" placeholder="09:00, 14:00, 20:00">
    </label>

    <h2 style="margin-top:28px">Continuity & Shared Memory</h2>
    <p class="dim">Control cross-companion knowledge sharing and shared context across profiles.</p>
    <label style="margin-top:12px;display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="share" ${s.share_people?'checked':''} style="width:auto">
      <span>Share what this companion learns about you with other companions</span>
    </label>
  </div>

  <div class="card" data-preference-panel="photos">
    <h2>Photo Sessions & Visual Timeline</h2>
    <p class="dim">Create visual glimpses of their recorded scene every 15 minutes. Requires an active image provider; generated scenes appear in Photos & albums.</p>
    <div class="form-grid" style="margin-top:14px">
      <label>Image style
        <select id="image-style">${Object.entries(s.image_styles).map(([k,v])=>`<option value="${esc(k)}" ${s.image_style===k?'selected':''}>${esc(v)}</option>`).join('')}</select>
      </label>
      <label>Timeline storage budget, GB
        <input id="gb" type="number" step="0.5" min="0" value="${s.timeline_budget_gb}">
      </label>
    </div>
    <label style="margin-top:14px;display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="tl" ${s.image_timeline?'checked':''} style="width:auto">
      <span>Enable 15-minute photo sessions</span>
    </label>
  </div>

  <div class="card" data-preference-panel="relationship">
    <h2>Connection & Familiarity Pace</h2>
    <p class="dim">Configure how connection and familiarity unfold over time.</p>
    <div class="form-grid" style="margin-top:14px">
      <label>Progression display
        <select id="progression">${options([['off','Hide progression'],['subtle','Subtle, natural familiarity'],['milestones','Show shared milestones']],s.relationship_progression)}</select>
      </label>
      <label>Relationship pace
        <select id="pace">${options([['slow','Slow and gradual'],['natural','Natural'],['quick','Open to quicker familiarity']],s.relationship_pace)}</select>
      </label>
      <label>Interaction with other companions
        <select id="peer-interaction">${options([['true','Enabled'],['false','Disabled']],String(s.peer_interaction))}</select>
      </label>
    </div>

    <h2 style="margin-top:28px">Tone & Boundaries</h2>
    <div class="form-grid" style="margin-top:14px">
      <label>Relationship Intimacy & Romance
        <select id="adult-themes">${options([['false','Friendly / Platonic Only'],['true','Romantic Connection Enabled']],String(s.explicit))}</select>
      </label>
    </div>
    <label style="margin-top:16px;display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="bars" ${s.bars?'checked':''} style="width:auto">
      <span>Show connection, feelings, and closeness meters</span>
    </label>
  </div>

  <div class="card" data-preference-panel="senses">
    <h2>Location & Living Context</h2>
    <p class="dim">Anchors local time, weather awareness, and realistic regional context for your shared dialogue.</p>
    <label style="margin-top:12px">Where you live
      <input id="loc" value="${esc(s.location)}" placeholder="Raleigh, NC">
    </label>

    <h2 style="margin-top:28px">Ambient Awareness Sensors</h2>
    <p class="dim">Passive contextual inputs that help your companion stay grounded in reality without requiring explicit messages.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px">
      ${Object.entries(s.available_sensors).map(([k,blurb])=>`
        <label style="background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;margin:0;cursor:pointer">
          <input type="checkbox" data-sensor="${k}" ${s.sensors.includes(k)?'checked':''} style="width:auto;margin-top:3px">
          <div>
            <strong style="color:var(--ink);display:block;margin-bottom:2px">${k}</strong>
            <span class="dim small" style="line-height:1.4">${esc(blurb)}</span>
          </div>
        </label>`).join('')}
    </div>
  </div>

  <div class="card" data-preference-panel="network">
    <h2>Server & Network Reachability</h2>
    <p class="dim">Manage reachable addresses, ports, and remote security when running as a 24/7 background companion (e.g. on Android Termux or a local server).</p>
    
    <h3 style="margin-top:20px;font-size:15px">Connection Endpoints</h3>
    <div id="network-endpoints-list" style="margin-top:10px;display:flex;flex-direction:column;gap:10px">
      <div style="background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <strong style="color:var(--ink)">On-Device (Localhost)</strong>
            <span class="pill status-good" style="font-size:11px">Direct · Bypass PIN</span>
          </div>
          <code id="net-localhost-url" style="font-size:13px;color:var(--accent)">http://localhost:38439</code>
          <p class="dim small" style="margin:4px 0 0">Use this in the browser directly on the phone or host machine.</p>
        </div>
        <button class="quiet" type="button" id="copy-localhost-btn">Copy</button>
      </div>

      <div id="net-lan-container" style="background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <strong style="color:var(--ink)">Local Wi-Fi Network (LAN)</strong>
            <span class="pill status-warn" style="font-size:11px" id="net-pin-badge">Checking...</span>
          </div>
        </div>
        <div id="net-lan-list" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
          <span class="dim small">Discovering network addresses…</span>
        </div>
        <p class="dim small" style="margin:8px 0 0">Use these addresses to access your companion from a laptop, desktop, or tablet on your Wi-Fi.</p>
      </div>
    </div>

    <h3 style="margin-top:28px;font-size:15px">Remote Access PIN Protection</h3>
    <p class="dim">A simple 4-digit PIN required when connecting from another device on your local network. Localhost on the phone itself never requires a PIN.</p>
    
    <div style="margin-top:14px;max-width:440px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <span class="pill ${s.remote_pin?'status-good':'status-warn'}" id="pin-status-pill">
          ${s.remote_pin ? 'PIN Active' : 'No PIN (Open Access)'}
        </span>
        <span class="dim small" id="pin-status-text">
          ${s.remote_pin ? 'Remote connections must enter this 4-digit PIN.' : 'Anyone on your Wi-Fi can view this workspace.'}
        </span>
      </div>

      <label>4-Digit Security PIN
        <div style="display:flex;gap:10px;margin-top:6px">
          <input id="remote-pin-field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="${s.remote_pin?'••••':'e.g. 1234'}" style="letter-spacing:6px;font-size:18px;max-width:160px;text-align:center">
          <button class="act" id="save-remote-pin" type="button">Set PIN</button>
          ${s.remote_pin ? '<button class="quiet" id="clear-remote-pin" type="button">Remove PIN</button>' : ''}
        </div>
      </label>
      <div id="pin-feedback" class="small" style="margin-top:8px" role="status"></div>
    </div>
  </div>

  <div class="settings-save"><button class="act" id="save">Save preferences</button> <span id="saved" class="dim" role="status"></span></div>`;
  api('/network').then(net=>{
    if($('net-localhost-url'))$('net-localhost-url').textContent=net.localhost_url;
    if($('copy-localhost-btn'))$('copy-localhost-btn').onclick=()=>{navigator.clipboard.writeText(net.localhost_url);if(typeof notice==='function')notice('Copied localhost URL');};
    const lanList=$('net-lan-list');
    if(lanList){
      if(net.lan_urls&&net.lan_urls.length){
        lanList.innerHTML=net.lan_urls.map(url=>`
          <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 12px;border-radius:6px;border:1px solid var(--surface-2)">
            <code style="color:var(--accent);font-size:13px">${esc(url)}</code>
            <button class="quiet" type="button" style="padding:4px 10px;font-size:12px" data-copy-lan="${esc(url)}">Copy</button>
          </div>
        `).join('');
        for(const b of lanList.querySelectorAll('[data-copy-lan]')){
          b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copyLan);if(typeof notice==='function')notice('Copied LAN URL');};
        }
      }else{
        lanList.innerHTML='<span class="dim small">No external Wi-Fi IP detected.</span>';
      }
    }
    const pinBadge=$('net-pin-badge');
    if(pinBadge){
      pinBadge.textContent=net.remote_pin_configured?'PIN Protected':'No PIN (Open Access)';
      pinBadge.className='pill '+(net.remote_pin_configured?'status-good':'status-warn');
    }
  }).catch(()=>{});
  const pinInput=$('remote-pin-field');
  const savePinBtn=$('save-remote-pin');
  const clearPinBtn=$('clear-remote-pin');
  const pinFeedback=$('pin-feedback');
  if(savePinBtn){
    savePinBtn.onclick=async()=>{
      const val=(pinInput.value||'').trim();
      if(!val||val.length!==4||!/^\d{4}$/.test(val)){
        pinFeedback.innerHTML='<span class="bad">PIN must be exactly 4 numeric digits.</span>';
        return;
      }
      try{
        savePinBtn.disabled=true;
        await api('/settings',{method:'POST',body:JSON.stringify({remote_pin:val})});
        pinFeedback.innerHTML='<span class="good">✓ 4-digit PIN saved and activated!</span>';
        pinInput.value='';
        setTimeout(()=>renderSettings(),1000);
      }catch(err){
        pinFeedback.innerHTML=`<span class="bad">${esc(err.message)}</span>`;
      }finally{
        savePinBtn.disabled=false;
      }
    };
  }
  if(clearPinBtn){
    clearPinBtn.onclick=async()=>{
      if(!confirm('Remove PIN protection? Anyone on your local Wi-Fi will be able to access the workspace without entering a PIN.'))return;
      try{
        clearPinBtn.disabled=true;
        await api('/settings',{method:'POST',body:JSON.stringify({remote_pin:''})});
        pinFeedback.innerHTML='<span class="good">✓ PIN protection removed.</span>';
        setTimeout(()=>renderSettings(),1000);
      }catch(err){
        pinFeedback.innerHTML=`<span class="bad">${esc(err.message)}</span>`;
      }finally{
        clearPinBtn.disabled=false;
      }
    };
  }
  $('cap-unlimited').onchange=()=>{$('cap').disabled=$('cap-unlimited').checked;};
  if($('spontaneous-nsfw')){$('spontaneous-nsfw').onchange=()=>{if($('spontaneous-nsfw').checked){if(!confirm('This setting will require a compatible image provider')){  $('spontaneous-nsfw').checked=false;}}};}
  $('save').onclick=async()=>{
    if(!$('cap-unlimited').checked&&!$('cap').reportValidity())return;
    const sensors=[...$('settings').querySelectorAll('[data-sensor]')].filter(x=>x.checked).map(x=>x.dataset.sensor);
    try{
      const result=await api('/settings',{method:'POST',body:JSON.stringify({
        quiet_start:$('qs').value,quiet_end:$('qe').value,outreach:$('out').value,
        outreach_per_day:$('cap-unlimited').checked?0:Number($('cap').value),adaptive_quiet:$('adapt').checked,
        location:$('loc').value,sensors,
        autonomy_windows:$('win').value.split(',').map(x=>x.trim()).filter(Boolean),
        timeline_budget_gb:Number($('gb').value),image_timeline:$('tl').checked,image_style:$('image-style').value,
        share_people:$('share').checked,bars:$('bars').checked,
        relationship_progression:$('progression').value,relationship_pace:$('pace').value,
        explicit:$('adult-themes')?$('adult-themes').value==='true':false,
        peer_interaction:$('peer-interaction').value==='true',
        content_permissions:{image:$('pimage').value,voice:$('pvoice').value}})});
      clearEditorDirty('settings-main');$('saved').textContent='Preferences saved';if(result.operation)await followOperation(result.operation);
    }catch(e){$('saved').innerHTML=`<span class="bad">${esc(e.message)}</span>`;}
  };
}

async function uploadPortrait(file){
  // Raw bytes, not multipart: the server reads the body and Pillow decides
  // whether it is a photograph.
  const headers={'content-type':'application/octet-stream'};
  if(token)headers['x-companion-token']=token;
  const r=await fetch(scoped('/api/portrait'),{method:'POST',headers,body:file});
  if(!r.ok){const error=new Error((await r.json().catch(()=>({}))).detail||('Request failed: '+r.status));error.status=r.status;throw error;}
  return r.json();
}

function likenessCard(p){
  return `<div class="card"><h2>Reference portrait ${p.stored?'<span class="pill">stored</span>':''}</h2>
    ${p.stored?`<img src="${mediaUrl('/media/portrait?t='+Date.now())}" alt="reference portrait"
      style="max-width:220px;border-radius:8px;display:block;margin-bottom:10px">`:''}
    <p class="dim">One photograph, kept in the vault, passed to image providers that accept a
    reference. Describing it asks a model to read the face and propose the appearance section —
    that is the only thing on this page that calls a model, and it writes nothing by itself.</p>
    <label class="quiet" style="display:inline-block;padding:6px 10px;cursor:pointer">
      ${p.stored?'Replace it':'Choose a photo'}<input id="pfile" type="file"
      accept="image/png,image/jpeg,image/webp" hidden></label>
    ${p.stored?`<button class="quiet" id="pdesc">Describe this face</button>
      <button class="quiet" id="pdrop">Forget it</button>`:''}
    <span class="dim" id="pmsg"></span>
    <div id="pprop"></div></div>`;
}

function wireLikeness(){
  const msg=$('pmsg');
  $('pfile').onchange=async()=>{
    const file=$('pfile').files[0];if(!file)return;
    msg.textContent='storing…';
    try{await uploadPortrait(file);renderIdentity();}
    catch(e){msg.innerHTML=`<span class="bad">${esc(e.message)}</span>`;}
  };
  if($('pdrop'))$('pdrop').onclick=async()=>{
    try{await api('/portrait',{method:'DELETE'});renderIdentity();}
    catch(e){msg.innerHTML=`<span class="bad">${esc(e.message)}</span>`;}
  };
  if($('pdesc'))$('pdesc').onclick=async()=>{
    msg.textContent='looking…';$('pdesc').disabled=true;
    try{
      const d=await api('/portrait/describe',{method:'POST',body:'{}'});
      msg.textContent='';
      $('pprop').innerHTML=`<p class="dim">Proposed, not saved. Read it, edit anything wrong, then
        keep it — or close it and nothing happens.</p>
        <textarea id="pbody">${esc(d.body)}</textarea>
        <button class="quiet" id="pkeep">Keep this as her appearance</button>
        <button class="quiet" id="pdiscard">Discard</button>
        <span class="dim" id="pkmsg"></span>`;
      $('pdiscard').onclick=()=>{$('pprop').innerHTML='';};
      $('pkeep').onclick=async()=>{
        try{
          await api('/identity/appearance',{method:'POST',
            body:JSON.stringify({body:$('pbody').value})});
          clearEditorDirty('identity-appearance');renderIdentity();
        }catch(e){$('pkmsg').innerHTML=`<span class="bad">${esc(e.message)}</span>`;}
      };
    }catch(e){msg.innerHTML=`<span class="bad">${esc(e.message)}</span>`;}
    finally{if($('pdesc'))$('pdesc').disabled=false;}
  };
}

async function renderIdentity(){
  const [d,p]=await Promise.all([api('/identity'),api('/portrait')]);
  const who=d.profile||{};
  const SECTION_TITLE={core:'Who they are',relationship:'The two of you',appearance:'How they look',
    visual:'Visual presence',emotion:'How they feel things',voice:'How they speak',
    boundaries:'What they will not do',continuity:'Continuity'};
  const SECTION_NOTE={core:'The person underneath everything else.',
    relationship:'How you know each other, and how that is written.',
    appearance:'Concrete details. Vagueness here produces a different person in every image.',
    visual:'Whether they have a face at all, and what carries their presence if not.',
    emotion:'Their emotional range and what moves it.',
    voice:'Sentence length, punctuation, the shape of how they talk.',
    boundaries:'Lines they hold regardless of how the conversation goes.',
    continuity:'What persists between conversations.'};
  const pronoun=who.pronoun_set==='he'?'He / him':'She / her';
  const facts=[
    who.persona_label&&['Personality',who.persona_label,who.persona_blurb],
    who.boundary_label&&['Between you',who.boundary_label,''],
    ['Pronouns',pronoun,''],
    [who.birthdate?'Born':'Age',who.birthdate||(who.age+' years old'),who.birthdate?who.age+' years old':'No birthday set'],
    ['Kind of agent',(who.agent_type||'companion').replace(/^./,c=>c.toUpperCase()),''],
    ['Their timezone',who.timezone||'—','']
  ].filter(Boolean);
  const hero=`<section class="identity-hero">
    <div class="identity-avatar" aria-hidden="true">${esc((who.agent||'?').slice(0,1))}</div>
    <div class="identity-hero-copy">
      <span class="eyebrow">${esc(who.human?who.human+'\u2019s companion':'Companion')}</span>
      <h2>${esc(who.agent||'Your companion')}</h2>
      ${who.persona_blurb?`<p>${esc(who.persona_blurb)}</p>`:''}
    </div>
    <dl class="identity-facts">${facts.map(([k,v,note])=>
      `<div><dt>${esc(k)}</dt><dd>${esc(v)}${note?`<small>${esc(note)}</small>`:''}</dd></div>`).join('')}</dl>
  </section>`;
  const warn=d.portrait&&!d.portrait.ready
    ? `<div class="notice-strip"><p><strong>Images need an appearance first.</strong> ${esc(d.portrait.reason)}</p></div>`:'';
  $('identity').innerHTML=hero+warn+likenessCard(p)+
    `<div class="section-heading"><h2>Their documents</h2><span class="dim small">Plain text, exactly as Hermes reads it.</span></div>`+
    d.sections.map(s=>`
    <div class="card identity-section">
      <div class="identity-section-head">
        <div><h3>${esc(SECTION_TITLE[s.name]||s.name)} ${s.locked?'<span class="pill">theirs to write</span>':''}</h3>
        ${SECTION_NOTE[s.name]?`<p class="dim small">${esc(SECTION_NOTE[s.name])}</p>`:''}</div>
        <code class="section-key">${esc(s.name)}</code>
      </div>
      <textarea data-section="${esc(s.name)}">${esc(s.body)}</textarea>
      <div class="identity-section-actions">
        <button class="quiet" data-save="${esc(s.name)}">Save this section</button>
        <span class="dim small" data-msg="${esc(s.name)}"></span>
      </div></div>`).join('')
    +`<p class="dim small">\u201cTheirs to write\u201d means they can change it themselves. You can too \u2014 it is your companion. Every save keeps a backup of the whole file.</p>`;
  wireLikeness();
  for(const b of $('identity').querySelectorAll('[data-save]')){
    b.onclick=async()=>{
      const name=b.dataset.save;
      const body=$('identity').querySelector(`[data-section="${name}"]`).value;
      const msg=$('identity').querySelector(`[data-msg="${name}"]`);
      try{await api('/identity/'+name,{method:'POST',body:JSON.stringify({body})});clearEditorDirty('identity-'+name);msg.textContent='Saved';}
      catch(e){msg.innerHTML=`<span class="bad">${esc(e.message)}</span>`;}
    };}
}

async function renderHealth(){
  const [h,cost]=await Promise.all([api('/health'),api('/cost')]);
  const top=Math.max(1,...cost.days.map(d=>d.input));
  $('health').innerHTML=`
  <div class="card"><h2>System Diagnostics</h2>
    ${h.problems.length?`<ul class="bad">${h.problems.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`
      :'<p class="dim">All monitored services healthy.</p>'}</div>
  <div class="card"><h2>Scheduled Jobs</h2><table><tr><th>Job</th><th>State</th><th>Last</th><th>Next</th></tr>
    ${h.jobs.map(j=>`<tr><td>${esc(j.name)}${j.no_agent?' <span class="pill">no model</span>':''}</td>
      <td>${j.enabled?'scheduled':'<span class="dim">paused</span>'}</td>
      <td>${j.last_status==='error'?`<span class="bad">${esc(j.last_status)}</span>`:esc(j.last_status||'—')}</td>
      <td class="dim">${esc((j.next_run_at||'—').slice(0,16).replace('T',' '))}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Memory & Storage</h2>
    <table>${h.memory.map(m=>`<tr><td>${esc(m.file)}</td><td>${m.chars.toLocaleString()} / ${m.cap.toLocaleString()}</td>
      <td>${m.over_warn?'<span class="warn">approaching limit</span>':'<span class="dim">optimal</span>'}</td></tr>`).join('')}
    ${h.storage.map(s=>`<tr><td>${esc(s.label)}</td><td>${s.files} files</td><td class="dim">${(s.bytes/1e6).toFixed(1)} MB</td></tr>`).join('')}
    <tr><td>vault history</td><td colspan="2">${h.vault_repo?'<span class="dim">recording</span>':'<span class="warn">not a git repo</span>'}</td></tr></table></div>
  <div class="card"><h2>Token Usage</h2>
    ${cost.available?`<div class="spark">${cost.days.map(d=>`<i style="height:${Math.round(d.input/top*100)}%" title="${d.day}: ${d.input.toLocaleString()} in"></i>`).join('')}</div>
      <p class="dim">${cost.days.length} day(s) recorded from Hermes usage log.</p>`
      :'<p class="dim">No usage recorded yet.</p>'}</div>`;
}

setInterval(()=>{if(current==='now'&&!$('product-dialog').open)render('now').catch(()=>{});},30000);

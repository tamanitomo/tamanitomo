<script>
/* Paint the saved palette before the first render, so the workspace never
   flashes the default theme on the way to the chosen one. */
(function(){var r=document.documentElement;try{
  var s=JSON.parse(localStorage.getItem('companion-appearance')||'{}');
  var t=s.follow_system?(matchMedia('(prefers-color-scheme: dark)').matches?s.dark_theme:s.light_theme):s.theme;
  r.dataset.theme=t||'midnight';
  if(s.accent)r.style.setProperty('--accent',s.accent);
}catch(e){r.dataset.theme='midnight';}})();
</script>

<script>
const TABS=[['now','Home'],['chat','Conversation'],['timeline','Timeline'],['photos','Photos & albums'],['journals','Journal'],['creations','Creations'],['relationship','Together'],['loops','Plans & calendar'],['knows','Memories'],['vault','Vault'],['identity','Identity'],['settings','Preferences'],['environment','Hermes settings'],['health','Jobs & health'],['roster','Companions'],['more','More']];
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);
const token=params.get('token')||sessionStorage.getItem('companion-token')||'';
if(token)sessionStorage.setItem('companion-token',token);
if(params.has('token')){params.delete('token');history.replaceState(null,'',location.pathname+'?'+params+location.hash);}
const INSTALLATION=params.get('installation')||'existing';
let PROFILE=params.get('profile');
function scoped(path){const u=new URL(path,location.origin);u.searchParams.set('installation',INSTALLATION);if(PROFILE)u.searchParams.set('profile',PROFILE);return u.pathname+u.search;}
function rawMediaUrl(path){const u=new URL(scoped(path),location.origin);if(token)u.searchParams.set('token',token);return u.pathname+u.search;}
function mediaUrl(path){return esc(rawMediaUrl(path));}
/* The companion's own face, wherever a placeholder initial used to stand.
   Whether a portrait exists is asked once and remembered, so a companion with
   no portrait never renders a broken image; the initial is what shows. */
let portraitStored=false;
async function refreshPortraitState(){
  try{portraitStored=!!(await api('/portrait')).stored;}
  catch(error){portraitStored=false;}
  return portraitStored;
}
function faceHtml(name,cls){
  const letter=esc(String(name||'?').trim().slice(0,1).toUpperCase()||'?');
  const face=portraitStored
    ? `<img src="${mediaUrl('/media/portrait?v='+portraitVersion)}" alt="" loading="lazy">`:'';
  return `<div class="avatar has-face ${esc(cls||'')}"><span>${letter}</span>${face}</div>`;
}
/* Bumped when the portrait changes, so a replaced face is not served from cache. */
let portraitVersion=Date.now();
// Belt and braces: a portrait removed in another tab would otherwise linger as a
// broken frame until the next reload. Error events do not bubble, so capture.
document.addEventListener('error',event=>{
  const img=event.target;
  if(img&&img.tagName==='IMG'&&img.closest('.avatar.has-face')){img.remove();portraitStored=false;}
},true);
const workspaceHandlers={};
async function api(path,options){
  const opts=Object.assign({headers:{'content-type':'application/json'}},options||{});
  if(token)opts.headers['x-companion-token']=token;
  const r=await fetch(scoped('/api'+path),opts);
  if(!r.ok){
    const d=await r.json().catch(()=>({}));
    if(r.status===401&&d.pin_required){
      initPinModal();
      showPinModal();
    }
    const error=new Error(d.detail||d.error||('Request failed: '+r.status));
    error.status=r.status;
    error.pin_required=Boolean(d.pin_required);
    throw error;
  }
  return r.json();
}

function showPinModal(){
  const modal=$('pin-modal');
  if(!modal)return;
  const input=$('pin-modal-input');
  const error=$('pin-modal-error');
  if(error){error.textContent='';error.style.display='none';}
  if(input)input.value='';
  if(!modal.open){
    try{modal.showModal();}catch(e){modal.setAttribute('open','true');}
  }
  if(input)setTimeout(()=>input.focus(),50);
}

function initPinModal(){
  const form=$('pin-modal-form');
  const input=$('pin-modal-input');
  const error=$('pin-modal-error');
  const submitBtn=$('pin-modal-submit');
  if(!form||form._wired)return;
  form._wired=true;
  if(input){
    input.oninput=()=>{
      if(input.value.length===4){
        form.requestSubmit();
      }
    };
  }
  form.onsubmit=async(e)=>{
    e.preventDefault();
    const pin=(input.value||'').trim();
    if(pin.length!==4||!/^\d{4}$/.test(pin)){
      error.textContent='Please enter a 4-digit numeric PIN';
      error.style.display='block';
      return;
    }
    submitBtn.disabled=true;
    try{
      const r=await fetch(scoped('/api/auth/pin'),{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({pin})
      });
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.ok){
        error.style.display='none';
        try{$('pin-modal').close();}catch(err){$('pin-modal').removeAttribute('open');}
        if(typeof boot==='function')await boot();
        else await render(current);
      }else{
        error.textContent=d.detail||'Incorrect 4-digit PIN. Please try again.';
        error.style.display='block';
        input.value='';
        input.focus();
      }
    }catch(err){
      error.textContent='Could not contact companion server';
      error.style.display='block';
    }finally{
      submitBtn.disabled=false;
    }
  };
}
document.addEventListener('DOMContentLoaded',()=>initPinModal());
let current='now';
async function showTab(name){
  if(typeof confirmEditorLeave==='function'&&!await confirmEditorLeave(current))return;
  if(name!=='chat'&&window.stopBrowserVoice)stopBrowserVoice();
  current=name;history.replaceState(null,'',location.pathname+location.search+'#'+name);
  for(const [id] of TABS){const el=$(id);if(el)el.hidden=id!==name;}
  for(const b of $('tabs').querySelectorAll('button[data-tab]'))b.setAttribute('aria-current',String(b.dataset.tab===name));
  if(window.productNavigate)window.productNavigate(name);
  const cur=$(name);
  if(cur&&!cur.textContent.trim())cur.innerHTML='<div class="card dim" role="status">Loading your companion’s world…</div>';
  render(name);
}
$('tabs').innerHTML=TABS.map(([id,label])=>`<button data-tab="${id}">${label}</button>`).join('');
for(const b of $('tabs').querySelectorAll('button[data-tab]'))b.onclick=()=>showTab(b.dataset.tab);

function ago(iso){
  if(!iso)return 'never';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90)return 'just now';
  if(s<5400)return Math.round(s/60)+' minutes ago';
  if(s<172800)return Math.round(s/3600)+' hours ago';
  return Math.round(s/86400)+' days ago';
}

async function render(name){
  try{
    if(name==='chat'&&typeof stopBrowserVoice==='function')stopBrowserVoice();
    if(workspaceHandlers[name])return await workspaceHandlers[name]();
    if(name==='now')return await renderNow();
    if(name==='timeline')return await renderTimeline();
    if(name==='loops')return await renderLoops();
    if(name==='knows')return await renderKnows();
    if(name==='settings')return await renderSettings();
    if(name==='identity')return await renderIdentity();
    if(name==='health')return await renderHealth();
  }catch(e){$(name).innerHTML=`<div class="card bad">Could not load this: ${esc(e.message)}</div>`;}
}

async function renderNow(){
  const d=await api('/overview');
  $('who').textContent=d.agent;
  $('sub').textContent=`${d.type} · ${d.age} · ${d.human} · ${d.timezone}`;
  $('banner').innerHTML=d.problems.length
    ? `<span class="bad">${d.problems.length} thing(s) not working</span>`
    : (d.birthday_in===0?'<span class="warn">It is her birthday today</span>':'');
  const s=d.state&&d.state.state;
  const unconfirmed=s&&s.confirmed===false;
  const moods=d.moods.slice().reverse();
  $('now').innerHTML=`
  <div class="card">
    <h2>Right now</h2>
    ${s?`<p class="big">${esc(s.activity)} — ${esc(s.location)}</p>
      <p class="dim">${esc(s.outfit.map(o=>o.description).join(', '))}</p>
      <p>Mood: ${esc(s.mood)}</p>
      ${s.wants&&s.wants.length?`<p class="dim">Wants: ${esc(s.wants.join('; '))}</p>`:''}
      ${s.private_stance?`<p class="dim">Where she stands: ${esc(s.private_stance)}</p>`:''}
      <p class="dim">recorded ${ago(d.state.recorded_at)}
      ${unconfirmed?'<span class="warn"> · unconfirmed, carried forward by a script</span>':''}</p>`
     :'<p class="dim">No state recorded yet.</p>'}
  </div>
  <div class="row">
    <div class="card"><h2>Mood, recently</h2>
      <div class="spark">${moods.map((m,i)=>`<i style="height:${20+((i*37)%70)}%" title="${esc(m.mood)}"></i>`).join('')}</div>
      <ul class="dim" style="margin-top:12px">${moods.slice(-5).reverse().map(m=>`<li>${esc(m.mood)}</li>`).join('')}</ul>
    </div>
    ${d.bars?`<div class="card"><h2>How it is going</h2>
      <p>Feeling the gap <strong>${Math.round((d.bars.feeling_the_gap||0)*100)}%</strong>${d.bars.wellbeing!=null?` · Wellbeing <strong>${Math.round(d.bars.wellbeing*100)}%</strong>`:''}</p>
      <p class="dim">Computed from how long it has been and what she has recorded feeling. She sees these; nothing tells her to mention them.</p></div>`:''}
    <div class="card"><h2>The thread</h2>
      ${d.thread&&d.thread.available
        ?`<p class="big">${esc(d.thread.register)}</p>
          <p class="dim">last from ${esc(d.human)} ${ago(d.thread.last_from_human)}</p>
          <p class="dim">${esc(d.thread.guidance)}</p>`
        :'<p class="dim">No conversation history yet.</p>'}
    </div>
  </div>
  <div class="row">
    <div class="card"><h2>Open loops (${d.loops.length})</h2>
      <ul>${d.loops.map(l=>`<li>${esc(l.title)}<br><span class="dim">${esc(l.gentle_use)}</span></li>`).join('')||'<li class="dim">Nothing hanging.</li>'}</ul></div>
    <div class="card"><h2>Waiting to send (${d.queued.length})</h2>
      <ul>${d.queued.map(q=>`<li><span class="pill">${esc(q.content)}</span> ${esc(q.body.slice(0,90))}</li>`).join('')||'<li class="dim">Nothing queued.</li>'}</ul></div>
  </div>`;
}

async function renderTimeline(){
  const d=await api('/timeline');
  if(!d.enabled){$('timeline').innerHTML='<div class="card dim">The image timeline is switched off for this companion.</div>';return;}
  const c=d.captures;
  $('timeline').innerHTML=`
  <div class="card">
    <h2>Scrub the day</h2>
    <input id="scrub" type="range" min="0" max="${Math.max(0,c.length-1)}" value="0">
    <div id="frame"></div>
  </div>
  <div class="card"><h2>${c.length} captures · ${d.budget_gb} GB budget</h2>
    <div class="grid">${c.map((x,i)=>`<figure class="shot" style="margin:0">
      <img src="${mediaUrl(x.image)}" loading="lazy" data-i="${i}" alt="${esc(x.activity)}">
      <figcaption class="cap">${esc(x.at||'').slice(0,16).replace('T',' ')}<br>${esc(x.activity)} — ${esc(x.location)}
      <br><button class="quiet" data-keep="${x.id}">Keep</button></figcaption></figure>`).join('')||'<p class="dim">No images yet.</p>'}</div>
  </div>
  ${d.albums.length?`<div class="card"><h2>Albums</h2><ul>${d.albums.map(a=>`<li>${esc(a.name)} — ${a.count} image(s)</li>`).join('')}</ul></div>`:''}`;
  const frame=(i)=>{const x=c[i];if(!x){$('frame').innerHTML='';return;}
    $('frame').innerHTML=`<div class="row" style="margin-top:14px">
      <img src="${mediaUrl(x.image)}" style="max-width:320px;border-radius:8px">
      <div><p class="big">${esc(x.activity)} — ${esc(x.location)}</p>
      <p class="dim">${esc(x.outfit)}</p><p>Mood: ${esc(x.mood)}</p>
      <p class="dim">${esc(x.at||'').slice(0,16).replace('T',' ')}</p></div></div>`;};
  frame(0);
  const scrub=$('scrub');
  if(scrub)scrub.oninput=()=>frame(Number(scrub.value));
  for(const img of $('timeline').querySelectorAll('img[data-i]'))
    img.onclick=()=>{if(scrub){scrub.value=img.dataset.i;frame(Number(img.dataset.i));window.scrollTo({top:0,behavior:'smooth'});}};
  for(const b of $('timeline').querySelectorAll('[data-keep]'))
    b.onclick=async()=>{await api(`/timeline/${b.dataset.keep}/keep`,{method:'POST'});b.textContent='Kept';};
}

async function renderLoops(){
  const [d,m]=await Promise.all([api('/overview'),api('/missions')]);
  $('loops').innerHTML=`
  <div class="card"><h2>Add Task or Research Item</h2>
    <label>What do you want looked into?<input id="mtitle" placeholder="e.g. Research lodging options for weekend trip"></label>
    <label>Details & constraints<input id="mdetail" placeholder="Budget, preferences, specific requirements"></label>
    <label>Target completion date<input id="mwhen" placeholder="YYYY-MM-DD"></label>
    <button class="act" id="madd">Add to queue</button>
    <p class="dim" style="margin-top:10px">Processed during scheduled autonomy windows. Outbound updates respect quiet hours and daily message caps.</p>
  </div>
  <div class="card"><h2>Task Queue</h2>
    <table><tr><th>Task</th><th>Status</th><th></th></tr>
    ${m.missions.map(x=>`<tr><td>${esc(x.title)}<br><span class="dim">${esc(x.detail||'')}</span>
      ${x.detail_update?`<br><span class="dim">→ ${esc(x.detail_update)}</span>`:''}</td>
      <td><span class="pill">${esc(x.status)}</span></td>
      <td>${x.status==='open'?`<button class="quiet" data-drop="${x.id}">Drop</button>`:''}</td></tr>`).join('')
      ||'<tr><td class="dim" colspan="3">No active tasks in queue.</td></tr>'}</table></div>
  <div class="card"><h2>Open Threads</h2>
    <ul>${d.loops.map(l=>`<li><strong>${esc(l.title)}</strong>${l.detail?`<br>${esc(l.detail)}`:''}
      <br><span class="dim">Context: ${esc(l.gentle_use)}</span></li>`).join('')||'<li class="dim">No active open threads.</li>'}</ul>
    <p class="dim">Autonomous conversational threads tracked across sessions.</p></div>`;
  $('madd').onclick=async()=>{
    const title=$('mtitle').value.trim();if(!title)return;
    await api('/missions',{method:'POST',body:JSON.stringify(
      {title,detail:$('mdetail').value,wanted_by:$('mwhen').value})});
    renderLoops();};
  for(const b of $('loops').querySelectorAll('[data-drop]'))
    b.onclick=async()=>{await api(`/missions/${b.dataset.drop}/drop`,{method:'POST'});renderLoops();};
}

async function renderKnows(){
  const d=await api('/ledgers');
  $('knows').innerHTML=`
  <div class="card"><h2>Standing Guidelines (${d.standing.length})</h2>
    <ul>${d.standing.map(r=>`<li>${esc(r.instruction)}<br><span class="dim">Evidence: ${esc(r.evidence)}</span></li>`).join('')||'<li class="dim">None recorded.</li>'}</ul></div>
  <div class="card"><h2>Personal Facts (${d.facts.length})</h2>
    <table><tr><th>Fact</th><th>Evidence</th><th></th></tr>
    ${d.facts.map(f=>`<tr><td>${esc(f.statement)}<br><span class="pill">${esc(f.category)}</span></td>
      <td class="dim">${esc(f.evidence)}</td>
      <td><button class="quiet" data-forget="${f.id}">Mark incorrect</button></td></tr>`).join('')
      ||'<tr><td class="dim" colspan="3">No facts recorded yet.</td></tr>'}</table>
    <p class="dim">Marking a fact incorrect records a superseding correction without deleting original evidence.</p></div>
  <div class="card"><h2>Shared History & Milestones (${d.relationship.length})</h2>
    <ul>${d.relationship.map(r=>`<li><span class="pill">${esc(r.moment)}</span> ${esc(r.text)}</li>`).join('')||'<li class="dim">No milestones recorded yet.</li>'}</ul></div>
  <div class="card"><h2>Open Questions</h2>
    <ul>${d.questions.map(q=>`<li>${esc(q.text)}</li>`).join('')||'<li class="dim">No open questions.</li>'}</ul></div>`;
  for(const b of $('knows').querySelectorAll('[data-forget]'))
    b.onclick=async()=>{await api(`/facts/${b.dataset.forget}/forget`,{method:'POST'});renderKnows();};
}

async function renderSettings(){
  const s=await api('/settings');

async function uploadPortrait(file){
  // Raw bytes, not multipart: the server reads the body and Pillow decides
  // whether it is a photograph.
  const headers={'content-type':'application/octet-stream'};
  if(token)headers['x-companion-token']=token;
  const r=await fetch(scoped('/api/portrait'),{method:'POST',headers,body:file});
  if(!r.ok){const error=new Error((await r.json().catch(()=>({}))).detail||('Request failed: '+r.status));error.status=r.status;throw error;}
  return r.json();
}

/* ---------------------------------------------------------------- identity

   The SOUL is a document, so Identity reads as one: a single flowing page with
   a contents rail beside it and an Edit button on each marked section, which
   swaps that passage — and only that passage — for its raw markdown. The
   section keys, the locked flag and the unfinished ✎ EDIT placeholders are
   surfaced as tags instead of being left as noise inside a textarea.

   The reference portrait lives in the image studio now, with the rest of the
   image plumbing; nothing on this page calls a model. */

const SECTION_TITLE={
  core:'Who they are',relationship:'The two of you',appearance:'How they look',
  visual:'Visual presence',photorealistic:'Photorealistic mode',
  emotion:'How they feel things',voice:'How they speak',
  conversation:'How they hold a conversation',memory:'What they carry over',
  continuity:'Continuity','daily-life':'Their day',environment:'Where they are',
  boundary:'What they will not do',boundaries:'What they will not do',
  texting:'How they write',flirtation:'How they flirt',support:'How they help',
  conflict:'Conflict and repair',humor:'Their humour',flaws:'Where they are difficult',
  likes:'What they like',honesty:'Accuracy and honesty',priorities:'Operating rules',
  essence:'In one line'};
const SECTION_NOTE={
  core:'The person underneath everything else.',
  relationship:'How you know each other, and how that is written.',
  appearance:'Concrete details. Vagueness here produces a different person in every image.',
  visual:'Whether they have a face at all, and what carries their presence if not.',
  photorealistic:'How they are rendered when a photograph is asked for.',
  emotion:'Their emotional range and what moves it.',
  voice:'Sentence length, punctuation, the shape of how they talk.',
  conversation:'Answering, disagreeing, asking — and when to say nothing.',
  memory:'What persists between conversations, and what counts as a real memory.',
  continuity:'What persists between conversations.',
  'daily-life':'The routine that runs while you are not talking.',
  environment:'Where they are when nobody is looking.',
  boundary:'Lines they hold regardless of how the conversation goes.',
  boundaries:'Lines they hold regardless of how the conversation goes.',
  texting:'Message shape, pet names, and the habits they avoid.',
  flirtation:'Whether affection is spoken, and in what register.',
  support:'What they do when something is wrong.',
  conflict:'How an argument starts, and how it ends.',
  humor:'What they find funny, and how they play.',
  flaws:'Frictions they own — never a licence to be unkind.',
  likes:'Tastes and habits, including the part they wrote themselves.',
  honesty:'What happens when warmth and accuracy disagree.',
  priorities:'Guardrails for anything they do unattended.',
  essence:'The distilled version of everything above.'};
const sectionTitle=name=>SECTION_TITLE[name]||name.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
const sectionUnfinished=body=>(body||'').includes('✎ EDIT');

/* The body as it should be read. The section's own `## Heading` is already the
   passage title, the paired COMPANION- comments carry meaning worth showing as
   a labelled block, and every other HTML comment is plumbing. */
function soulPassages(body){
  const out=[];let prose=[],kind='',label='';
  const flush=()=>{const text=prose.join('\n').trim();if(text)out.push({kind:kind||'prose',label,text});prose=[];};
  let leading=true;
  for(const line of (body||'').split('\n')){
    const trimmed=line.trim();
    if(leading&&/^#{1,6} /.test(trimmed)){leading=false;continue;}
    if(trimmed)leading=false;
    if(/^<!--\s*COMPANION-PROMPT-EXCLUDE\s*-->$/.test(trimmed)){
      flush();kind='aside';label='Guidance for them, not for image prompts';continue;}
    if(/^<!--\s*COMPANION-SELF-AUTHORED:BEGIN\s*-->$/.test(trimmed)){
      flush();kind='self';label='Theirs to write — yours to read';continue;}
    if(/^<!--\s*(\/COMPANION-PROMPT-EXCLUDE|COMPANION-SELF-AUTHORED:END)\s*-->$/.test(trimmed)){
      flush();kind='';label='';continue;}
    if(/^<!--[\s\S]*-->$/.test(trimmed))continue;
    prose.push(line);
  }
  flush();
  return out;
}

/* Markdown soft wrapping: the templates wrap prose at about 75 columns, and a
   renderer that makes one paragraph per line turns that into a column of
   fragments. Consecutive prose lines are rejoined; anything that owns its line
   (heading, list item, quote, table row, fenced code) is left alone. */
function reflowSoftWraps(text){
  const KIND=line=>{
    const t=line.trim();
    if(!t)return 'blank';
    if(/^(#{1,6} )/.test(t))return 'heading';
    if(/^(-{3,}|_{3,}|\*{3,})$/.test(t))return 'rule';
    if(/^([-*+] |\d+\. )/.test(t))return 'list';
    if(t.startsWith('>'))return 'quote';
    if(t.startsWith('|'))return 'table';
    return 'prose';
  };
  const out=[];let fenced=false,last='blank';
  for(const line of text.split('\n')){
    if(/^```/.test(line.trim())){fenced=!fenced;out.push(line);last='fence';continue;}
    if(fenced){out.push(line);continue;}
    const kind=KIND(line);
    if(kind==='prose'&&(last==='prose'||last==='list'||last==='quote'))
      out[out.length-1]=out[out.length-1].replace(/\s+$/,'')+' '+line.trim();
    else{out.push(line);last=kind;}
  }
  return out.join('\n');
}

/* Rendered markdown, falling back to the raw text if the vault renderer has not
   loaded. Unwritten ✎ EDIT placeholders are marked so an unfinished section is
   visible from across the page rather than buried mid-paragraph. */
function soulBodyHTML(body){
  const render=typeof renderObsidianMarkdown==='function'
    ? renderObsidianMarkdown : text=>`<pre>${esc(text)}</pre>`;
  const blocks=soulPassages(body);
  if(!blocks.length)return '<p class="dim soul-empty">Nothing written here yet.</p>';
  return blocks.map(b=>{
    const html=render(reflowSoftWraps(b.text)).replace(/✎ EDIT:?/g,'<span class="soul-todo">✎ unwritten</span>');
    return b.kind==='prose'?html
      :`<aside class="soul-aside soul-aside-${b.kind}"><span class="soul-aside-label">${esc(b.label)}</span>${html}</aside>`;
  }).join('\n');
}

          <h3>${esc(sectionTitle(s.name))}</h3>
          <div class="soul-passage-tags">
            ${s.locked?'<span class="pill soul-lock" title="The companion cannot rewrite this section. You still can.">theirs to write</span>':''}
            <span class="pill soul-pill-todo" data-todo-pill="${esc(s.name)}"
              ${sectionUnfinished(s.body)?'':'hidden'}>needs writing</span>
            <code class="section-key">${esc(s.name)}</code>
          </div>
        </div>
        ${SECTION_NOTE[s.name]?`<p class="soul-passage-note">${esc(SECTION_NOTE[s.name])}</p>`:''}
        <button class="quiet soul-edit" data-edit="${esc(s.name)}">Edit</button>
      </div>
      <div class="soul-passage-body prose" data-body="${esc(s.name)}">${soulBodyHTML(s.body)}</div>
    </section>`).join('')}</article>`;

  $('identity').innerHTML=hero+warn+
    `<div class="section-heading" id="soul-heading">
      <div><h2>Their documents</h2>
      <span class="dim small">The SOUL exactly as Hermes reads it. Edit a section in place — every save keeps a backup.</span></div>
      <div class="actions" id="identity-tools"></div>
    </div>
    <div class="identity-doc-layout">${outline}${doc}</div>`;

  // The raw markdown is kept here so Cancel restores what the file actually
  // holds rather than a round trip through the rendered HTML.
  const raw=Object.fromEntries(sections.map(s=>[s.name,s.body||'']));
  const locked=Object.fromEntries(sections.map(s=>[s.name,!!s.locked]));
  const passage=name=>$('identity').querySelector(`[data-passage="${name}"]`);

  const read=name=>{
    const host=passage(name);host.classList.remove('is-editing');
    host.querySelector('.soul-edit').textContent='Edit';
    host.querySelector('[data-body]').outerHTML=
      `<div class="soul-passage-body prose" data-body="${name}">${soulBodyHTML(raw[name])}</div>`;
    for(const flag of $('identity').querySelectorAll(`[data-todo="${name}"],[data-todo-pill="${name}"]`))
      flag.hidden=!sectionUnfinished(raw[name]);
  };
  const write=name=>{
    const host=passage(name);host.classList.add('is-editing');
    host.querySelector('.soul-edit').textContent='Close editor';
    host.querySelector('[data-body]').outerHTML=`
      <div class="soul-passage-body soul-passage-edit" data-body="${name}">
        <textarea data-section="${name}" aria-label="${esc(sectionTitle(name))}, markdown">${esc(raw[name])}</textarea>
        <div class="soul-passage-actions">
          <button class="act" data-save="${name}">Save section</button>
          <button class="quiet" data-cancel="${name}">Cancel</button>
          <span class="dim small soul-syntax">Markdown: <code>##</code> heading, <code>**bold**</code>, <code>-</code> bullet.${
            locked[name]?' Locked against them, not against you.':''}</span>
          <span class="small" data-msg="${name}"></span>
        </div>
      </div>`;
    const area=host.querySelector('textarea');
    area.style.height=Math.min(700,Math.max(200,area.scrollHeight+30))+'px';
    area.focus();
  };
  const leaveEditor=async name=>
    !passage(name).classList.contains('is-editing')||!hasEditorChanges('identity-'+name)
      ||await confirmEditorLeave('identity-'+name);

  $('identity').onclick=async event=>{
    const jump=event.target.closest('[data-jump]'),toggle=event.target.closest('[data-edit]'),
          save=event.target.closest('[data-save]'),cancel=event.target.closest('[data-cancel]');
    if(jump){
      event.preventDefault();
      const target=$('soul-sec-'+jump.dataset.jump);
      if(!target)return;
      target.scrollIntoView({block:'start',behavior:'smooth'});
      target.classList.add('is-targeted');setTimeout(()=>target.classList.remove('is-targeted'),1500);
      return;
    }
    if(toggle){
      const name=toggle.dataset.edit;
      if(!passage(name).classList.contains('is-editing'))return write(name);
      if(await leaveEditor(name))read(name);
      return;
    }
    if(cancel){if(await leaveEditor(cancel.dataset.cancel))read(cancel.dataset.cancel);return;}
    if(!save)return;
    const name=save.dataset.save,msg=$('identity').querySelector(`[data-msg="${name}"]`);
    const body=$('identity').querySelector(`[data-section="${name}"]`).value;
    save.disabled=true;msg.innerHTML='<span class="dim">Saving…</span>';
    try{
      await api('/identity/'+name,{method:'POST',body:JSON.stringify({body})});
      raw[name]=body.replace(/^\n+|\n+$/g,'');
      clearEditorDirty('identity-'+name);
      read(name);
      notice('Saved. The whole file was backed up first.');
    }catch(e){msg.innerHTML=`<span class="bad">${esc(e.message)}</span>`;save.disabled=false;}
  };
}

async function renderHealth(){
  const [h,cost]=await Promise.all([api('/health'),api('/cost')]);
  const top=Math.max(1,...cost.days.map(d=>d.input));
  $('health').innerHTML=`
  <div class="card"><h2>System Diagnostics</h2>
    ${h.problems.length?`<ul class="bad">${h.problems.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`
      :'<p class="dim">All monitored services healthy.</p>'}</div>
  <div class="card"><h2>Scheduled Jobs</h2><table><tr><th>Job</th><th>State</th><th>Last</th><th>Next</th></tr>
    ${h.jobs.map(j=>`<tr><td>${esc(j.name)}${j.no_agent?' <span class="pill">no model</span>':''}</td>
      <td>${j.enabled?'scheduled':'<span class="dim">paused</span>'}</td>
      <td>${j.last_status==='error'?`<span class="bad">${esc(j.last_status)}</span>`:esc(j.last_status||'—')}</td>
      <td class="dim">${esc((j.next_run_at||'—').slice(0,16).replace('T',' '))}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Memory & Storage</h2>
    <table>${h.memory.map(m=>`<tr><td>${esc(m.file)}</td><td>${m.chars.toLocaleString()} / ${m.cap.toLocaleString()}</td>
      <td>${m.over_warn?'<span class="warn">approaching limit</span>':'<span class="dim">optimal</span>'}</td></tr>`).join('')}
    ${h.storage.map(s=>`<tr><td>${esc(s.label)}</td><td>${s.files} files</td><td class="dim">${(s.bytes/1e6).toFixed(1)} MB</td></tr>`).join('')}
    <tr><td>vault history</td><td colspan="2">${h.vault_repo?'<span class="dim">recording</span>':'<span class="warn">not a git repo</span>'}</td></tr></table></div>
  <div class="card"><h2>Token Usage</h2>
    ${cost.available?`<div class="spark">${cost.days.map(d=>`<i style="height:${Math.round(d.input/top*100)}%" title="${d.day}: ${d.input.toLocaleString()} in"></i>`).join('')}</div>
      <p class="dim">${cost.days.length} day(s) recorded from Hermes usage log.</p>`
      :'<p class="dim">No usage recorded yet.</p>'}</div>`;
}

setInterval(()=>{if(current==='now'&&!$('product-dialog').open)render('now').catch(()=>{});},30000);

name: Tests
# Integration check for pushes and pull requests. It does not gate a release:
# release.yml runs its own Linux gate, so a runner-only failure here cannot stop
# a version being published. A red run still means something to look at.
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    # The whole suite, with Node required: a missing Node fails the JS regressions
    # instead of skipping them.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    runs-on: ubuntu-latest
    env:
      TAMANITOMO_REQUIRE_NODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Check Python formatting
        if: matrix.python == '3.13'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m black --check kit/scripts kit/cli kit/app launch.py update_release.py
          python -m ruff check kit/scripts kit/cli kit/app
      - name: Run tests (no hermes on PATH)
        run: python -m pytest -q -rs --junitxml=junit.xml
      - name: Report failed tests as annotations
        # Job logs need a signed-in viewer; check-run annotations are public. So an annotation
        # carries only the test id, its file and the exception class as a category -- never the
        # assertion text or traceback, which can contain arbitrary strings. Details: the job log.
        if: failure()
        run: |
          python - <<'PY'
          import os, re
          import xml.etree.ElementTree as ET
          if not os.path.exists('junit.xml'):
              print('::notice title=No test report::junit.xml was not written; see the job log.')
              raise SystemExit(0)
          safe = lambda text, n: re.sub(r'[^A-Za-z0-9_.:/ -]', '', str(text or ''))[:n]
          for case in ET.parse('junit.xml').getroot().iter('testcase'):
              for tag in ('failure', 'error'):
                  node = case.find(tag)
                  if node is None:
                      continue
                  kind = re.match(r'\s*([A-Za-z_][\w.]*)', node.get('message') or '')
                  category = safe(kind.group(1).rsplit('.', 1)[-1] if kind else tag, 60)
                  cls = safe(case.get('classname'), 120)
                  path = cls.rsplit('.', 1)[0].replace('.', '/') + '.py' if '.' in cls else ''
                  print(f"::error file={path},title=Test {tag}::{cls}::{safe(case.get('name'), 120)} "
                        f"({category}); details in the job log")
          PY
      - name: Validate installer syntax
        run: bash -n setup-linux.sh setup-termux.sh update.sh uninstall-termux.sh

  smoke:
    # Exercise portable storage, process and application boundaries.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAMANITOMO_REQUIRE_NODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Run all domain suites
        run: python -m pytest -q -rs

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Validate release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/pytest.log && exit 0
          {
            echo "### pytest failed on the runner"
            echo ""
            echo "This suite passes on a clean checkout locally, so a failure here is"
            echo "usually environmental. The tail is reproduced so it can be read without"
            echo "downloading the log."
            echo ""
            echo '```'
            tail -80 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check browser scripts
        run: node tests/test_updates_ui.js
      - name: Build official asset
        run: |
          python tools/build_release.py --output build/tamanitomo-release.zip
          cd build
          sha256sum tamanitomo-release.zip > tamanitomo-release.zip.sha256
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/tamanitomo-release.zip build/tamanitomo-release.zip.sha256 \
            --verify-tag --title "Tamanitomo $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --latest

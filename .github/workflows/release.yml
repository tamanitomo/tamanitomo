name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Validate release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/pytest.log && exit 0
          python - <<'PY'
          import pathlib
          log = pathlib.Path('/tmp/pytest.log').read_text(errors='replace')
          # Annotations are the only part of a failed run readable without a token,
          # so the failure has to travel as one. Newlines are escaped per the
          # workflow-command format or everything after the first is dropped.
          tail = log[-5000:]
          esc = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=pytest failed on the runner::{esc}")
          PY
          exit 1
      - name: Build official asset
        run: |
          python tools/build_release.py --output build/tamanitomo-release.zip
          cd build
          sha256sum tamanitomo-release.zip > tamanitomo-release.zip.sha256
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/tamanitomo-release.zip build/tamanitomo-release.zip.sha256 \
            --verify-tag --title "Tamanitomo $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --latest
